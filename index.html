<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>货币战争 V4.2 • 策略对战</title>
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <div id="game-container">
        <header>
            <div class="stat-row">
                <span class="stat" id="s-gold">💰 0</span>
                <span class="stat" id="s-lvl">⭐ Lv.3</span>
                <span class="stat" id="s-xp">📖 0/4</span>
                <span class="stat" id="s-hp">❤️ 40/40</span>
                <span class="stat" id="s-node">📍 1-1</span>
            </div>
            <div class="actions">
                <button id="btn-refresh">刷新(2💰)</button>
                <button id="btn-levelup">升级(4💰)</button>
                <button id="btn-start-battle" disabled>▶ 进入战斗</button>
            </div>
        </header>

        <main id="main-view">
            <!-- 商店区 -->
            <section id="shop-panel">
                <h3>🏪 人才招募</h3>
                <div id="shop-grid" class="grid"></div>
            </section>

            <!-- 阵容区 -->
            <section id="team-panel">
                <h3>👥 备战席 & 上阵</h3>
                <div class="team-layout">
                    <div class="slot-group" id="frontline">
                        <h4>前台</h4>
                        <div class="slots" id="fl-slots"></div>
                    </div>
                    <div class="slot-group" id="backline">
                        <h4>后台</h4>
                        <div class="slots" id="bl-slots"></div>
                    </div>
                </div>
                <div class="bench-group">
                    <h4>备战席</h4>
                    <div class="slots" id="bench-slots"></div>
                </div>
            </section>

            <!-- 羁绊 & 面板 -->
            <section id="info-panel">
                <h3>🔗 羁绊状态</h3>
                <div id="bond-list" class="tag-list">未激活</div>
                <h3>📊 核心乘区</h3>
                <div id="stats-preview" class="stats-grid"></div>
            </section>
        </main>

        <footer id="log-panel">
            <h3>📜 战报/事件</h3>
            <div id="game-log" class="log-box"></div>
        </footer>

        <!-- 策略选择弹窗 -->
        <div id="strategy-modal" class="modal hidden">
            <div class="modal-content">
                <h3>📜 选择投资策略</h3>
                <div id="strategy-choices" class="choices"></div>
            </div>
        </div>

        <!-- 战斗结算弹窗 -->
        <div id="battle-modal" class="modal hidden">
            <div class="modal-content">
                <h3 id="battle-title">⚔️ 战斗中</h3>
                <div id="battle-log" class="log-box battle-log"></div>
                <button id="btn-close-battle" class="hidden">确认</button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/combat.js"></script>
</body>
</html>
