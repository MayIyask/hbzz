<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>货币战争 V4.2 • 策略对战</title>
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <div id="app">
        <!-- 1. 顶部状态条 -->
        <header id="status-bar">
            <span id="enemy-info">👹 等待刷新敌人...</span>
            <span id="progress">📍 1-1 位面</span>
            <span id="resources">❤️ 40/40 | 💰 10</span>
        </header>

        <!-- 2. 商店区 -->
        <section id="shop-section">
            <div id="shop-grid" class="shop-grid"></div>
            <button id="btn-refresh" class="circle-btn" title="刷新商店(2💰)">🔄</button>
            <div id="shop-odds">商店概率：1费 45% | 2费 33% | 3费 20% | 4费 2% | 5费 0%</div>
        </section>

        <!-- 3. 角色部署区 -->
        <main id="deploy-section">
            <div id="frontline-box" class="zone">
                <h4>⚔️ 前台 (3格)</h4>
                <div id="fl-slots" class="slots-3 drop-zone" data-zone="frontline"></div>
            </div>
            <div id="backline-box" class="zone">
                <h4>🛡️ 后台 (2格)</h4>
                <div id="bl-slots" class="slots-2 drop-zone" data-zone="backline"></div>
            </div>
            <div id="bottom-row">
                <!-- 左侧：经验面板 -->
                <div id="xp-panel">
                    <div class="xp-level">Lv.<span id="lvl-num">3</span></div>
                    <div class="xp-bar-bg"><div id="xp-bar"></div></div>
                    <div class="xp-text"><span id="xp-cur">0</span> / <span id="xp-req">4</span> XP</div>
                    <button id="btn-buy-xp" class="xp-btn">升级 (4💰)</button>
                </div>
                <!-- 右侧：备战席 -->
                <div id="bench-box">
                    <h4>🎒 备战席 (9格)</h4>
                    <div id="bench-slots" class="slots-9 drop-zone" data-zone="bench"></div>
                </div>
            </div>
            <!-- 羁绊与统计面板 -->
            <div id="info-panel" style="display:flex;gap:0.5rem;margin-top:0.5rem;">
                <div id="bonds-panel" style="flex:1;background:var(--surface);padding:0.6rem;border-radius:6px;border:1px solid var(--border);">
                    <h4 style="font-size:0.75rem;color:var(--text-dim);margin-bottom:0.4rem;">🔗 激活羁绊</h4>
                    <div id="bond-list" style="display:flex;flex-wrap:wrap;gap:0.3rem;"></div>
                </div>
                <div id="stats-panel" style="flex:1;background:var(--surface);padding:0.6rem;border-radius:6px;border:1px solid var(--border);">
                    <h4 style="font-size:0.75rem;color:var(--text-dim);margin-bottom:0.4rem;">📊 队伍统计</h4>
                    <div id="stats-preview"></div>
                </div>
            </div>
        </main>

        <!-- 游戏日志 -->
        <div id="game-log" style="position:fixed;top:60px;right:10px;width:280px;height:150px;background:rgba(0,0,0,0.8);border:1px solid var(--border);border-radius:6px;padding:0.5rem;overflow-y:auto;font-size:0.7rem;z-index:50;"></div>

        <!-- 4. 出售区域 (左右下角固定) -->
        <div id="sell-left" class="sell-zone">出售: <span class="price-val">0</span>💰</div>
        <div id="sell-right" class="sell-zone">出售: <span class="price-val">0</span>💰</div>

        <!-- 弹窗容器 -->
        <div id="popup-overlay" class="hidden">
            <div class="popup-box">
                <h3 id="popup-title">系统通知</h3>
                <div id="popup-content"></div>
                <button onclick="Popup.close()">确认</button>
            </div>
        </div>

        <!-- 战斗控制 -->
        <button id="btn-start-battle" class="battle-btn">▶ 进入战斗</button>
    </div>

    <script src="js/data.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/combat.js"></script>
</body>
</html>
